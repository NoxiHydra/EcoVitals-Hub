<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health Tracker</title>
  <style>
    body {
      background: #2f2f3f;
      color: #d1c4e9;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input, button {
      background: #4a3f5f;
      border: none;
      color: #d1c4e9;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 5px;
    }

    button {
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #654a9f;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    #chartContainer {
      margin-top: 30px;
      background: #3a2f4a;
      border-radius: 8px;
      box-shadow: 0 0 10px #654a9f;
      padding: 10px;
    }

    .chart-toggle {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>🩺 Health Tracker</h1>

  <label for="date">Date</label>
  <input type="date" id="date" />

  <label for="heart-rate">❤️ Heart Rate (bpm)</label>
  <input type="number" id="heart-rate" min="0" />

  <label for="steps">🚶 Steps</label>
  <input type="number" id="steps" min="0" />

  <label for="water-intake">💧 Water Intake (ml)</label>
  <input type="number" id="water-intake" min="0" />

  <button onclick="submitHealthData()">Submit Data</button>

  <button onclick="clearAllData()">🗑️ Delete All Data</button>

  <div class="chart-toggle">

    <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'heartRate')">
      ❤️ Heart Rate
    </button>

    <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'steps')">
      🚶 Steps
    </button>

    <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'waterIntake')">
      💧 Water
    </button>

  </div>

  <div id="chartContainer">
    <canvas id="healthChart" width="600" height="300"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

    let currentChartType = 'bar';
    let chartInstance;

    function submitHealthData() {

      const date = document.getElementById('date').value;
      const heartRate = parseInt(document.getElementById('heart-rate').value, 10);
      const steps = parseInt(document.getElementById('steps').value, 10);
      const waterIntake = parseInt(document.getElementById('water-intake').value, 10);

      if (!date || isNaN(heartRate) || isNaN(steps) || isNaN(waterIntake)) {
        alert('⚠️ Please fill out all fields correctly.');
        return;
      }

      if (heartRate > 160) {
        alert('🚨 Alert: Heart rate is too high!');
      }

      if (waterIntake < 2500) {
        alert('🚱 Alert: Low water intake! Drink more water.');
      }

      const newEntry = {
        date,
        heartRate,
        steps,
        waterIntake
      };

      try {

        let storedData = JSON.parse(localStorage.getItem('healthData')) || [];

        storedData.push(newEntry);

        localStorage.setItem('healthData', JSON.stringify(storedData));

        alert('✅ Data saved successfully!');

        renderChart(storedData, 'bar');

        ['date', 'heart-rate', 'steps', 'water-intake'].forEach(id => {
          document.getElementById(id).value = '';
        });

      } catch (err) {

        console.error("❌ Failed to save health data:", err);

        alert("⚠️ Something went wrong while saving your data.");
      }
    }

    function clearAllData() {

      const confirmDelete = confirm("⚠️ Delete all saved health data?");

      if (confirmDelete) {

        localStorage.removeItem('healthData');

        if (chartInstance) {
          chartInstance.destroy();
        }

        const ctx = document.getElementById('healthChart').getContext('2d');

        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

        alert("🗑️ All data deleted!");
      }
    }

    function toggleChart(type) {

      currentChartType = type;

      const savedData = JSON.parse(localStorage.getItem('healthData')) || [];

      renderChart(savedData, type);
    }

    function renderChart(data, type, metric = 'heartRate') {

      const ctx = document.getElementById('healthChart').getContext('2d');

      const grouped = {};

      data.forEach(entry => {

        if (!grouped[entry.date]) {

          grouped[entry.date] = {
            heartRate: [],
            steps: [],
            waterIntake: []
          };
        }

        grouped[entry.date].heartRate.push(entry.heartRate);
        grouped[entry.date].steps.push(entry.steps);
        grouped[entry.date].waterIntake.push(entry.waterIntake);
      });

      const dates = Object.keys(grouped).sort().slice(-7);

      const averaged = dates.map(date => {

        const vals = grouped[date];

        const avg = arr =>
          Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);

        return {
          date,
          heartRate: avg(vals.heartRate),
          steps: avg(vals.steps),
          waterIntake: avg(vals.waterIntake)
        };
      });

      const labels = averaged.map(entry => entry.date);

      let graphData = [];
      let graphLabel = '';
      let graphColor = '';
      let unit = '';

      if (metric === 'heartRate') {

        graphData = averaged.map(entry => entry.heartRate);

        graphLabel = '❤️ Heart Rate';

        graphColor = 'rgba(186, 85, 211, 1)';

        unit = 'BPM';
      }

      if (metric === 'steps') {

        graphData = averaged.map(entry => entry.steps);

        graphLabel = '🚶 Steps';

        graphColor = 'rgba(128, 0, 128, 1)';

        unit = 'Steps';
      }

      if (metric === 'waterIntake') {

        graphData = averaged.map(entry => entry.waterIntake);

        graphLabel = '💧 Water Intake';

        graphColor = 'rgba(147, 112, 219, 1)';

        unit = 'ml';
      }

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {

        type: type,

        data: {

          labels,

          datasets: [

            {
              label: `${graphLabel} (${unit})`,
              data: graphData,
              borderColor: graphColor,
              backgroundColor: graphColor.replace('1)', '0.3)'),
              fill: type === 'line',
              tension: 0.4,
              borderWidth: 3,
              pointRadius: type === 'line' ? 4 : 0,
              barThickness: type === 'bar' ? 25 : undefined
            }

          ]
        },

        options: {

          responsive: true,

          plugins: {

            title: {

              display: true,

              text: `${graphLabel} - Last 7 Days`,

              color: '#d1c4e9',

              font: {
                size: 20
              }
            },

            legend: {

              labels: {
                color: '#d1c4e9'
              }
            }
          },

          scales: {

            x: {

              ticks: {
                color: '#d1c4e9'
              },

              grid: {
                color: '#5a4e7a'
              }
            },

            y: {

  beginAtZero: true,

  max:
    metric === 'steps'
      ? 10000
      : metric === 'waterIntake'
      ? 10000
      : 200,

  ticks: {

    color: '#d1c4e9',

    stepSize:
      metric === 'steps'
        ? 1000
        : metric === 'waterIntake'
        ? 500
        : 20,

    callback: function(value) {
      return value + ' ' + unit;
    }
  },

  grid: {
    color: '#5a4e7a'
  }
}
          },

          animation: {

            duration: 1000,

            easing: 'easeOutQuart'
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {

      const savedData = JSON.parse(localStorage.getItem('healthData')) || [];

      if (savedData.length) {

        renderChart(savedData, currentChartType);
      }
    });

  </script>

<!-- EcoVitals AI Chatbot Widget -->
<style>
  #ecovitals-chat-widget {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 9999;
    font-family: Arial, sans-serif;
  }
  #chat-toggle-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7e22ce, #c084fc);
    border: none;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(192,132,252,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-left: auto;
  }
  #chat-toggle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(192,132,252,0.9);
  }
  #chat-toggle-btn svg {
    width: 28px;
    height: 28px;
    fill: #fff;
  }
  #chat-panel {
    display: none;
    flex-direction: column;
    width: 340px;
    height: 460px;
    background: #2a2038;
    border-radius: 16px;
    border: 1px solid rgba(192,132,252,0.3);
    box-shadow: 0 0 40px rgba(128,0,128,0.5);
    margin-bottom: 12px;
    overflow: hidden;
  }
  #chat-panel.open { display: flex; }
  #chat-header {
    background: linear-gradient(135deg, #4a1d7e, #7e22ce);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #chat-header-title {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #e9d5ff;
    font-weight: bold;
    font-size: 0.95rem;
  }
  #chat-header-title span.dot {
    width: 8px;
    height: 8px;
    background: #a3e635;
    border-radius: 50%;
    display: inline-block;
  }
  #chat-close-btn {
    background: none;
    border: none;
    color: #c4b5fd;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.2s;
  }
  #chat-close-btn:hover { color: #fff; }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: #5b21b6 #2a2038;
  }
  #chat-messages::-webkit-scrollbar { width: 5px; }
  #chat-messages::-webkit-scrollbar-track { background: #2a2038; }
  #chat-messages::-webkit-scrollbar-thumb { background: #5b21b6; border-radius: 4px; }
  .chat-msg {
    max-width: 88%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.5;
    word-break: break-word;
  }
  .chat-msg.bot {
    background: #3a2f4a;
    color: #d1c4e9;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }
  .chat-msg.user {
    background: linear-gradient(135deg, #5b21b6, #7e22ce);
    color: #f3e8ff;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
  }
  .chat-msg.typing {
    background: #3a2f4a;
    color: #9f8cb8;
    align-self: flex-start;
  }
  #chat-input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(192,132,252,0.2);
    flex-shrink: 0;
    background: #221a30;
  }
  #chat-input {
    flex: 1;
    background: #3a2f4a;
    border: 1px solid rgba(192,132,252,0.3);
    border-radius: 10px;
    padding: 9px 12px;
    color: #d1c4e9;
    font-size: 0.87rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #chat-input:focus { border-color: #c084fc; }
  #chat-input::placeholder { color: #7c6b99; }
  #chat-send-btn {
    background: linear-gradient(135deg, #7e22ce, #c084fc);
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    color: #fff;
    font-size: 0.87rem;
    cursor: pointer;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  #chat-send-btn:hover { opacity: 0.85; }
  #chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>

<div id="ecovitals-chat-widget">
  <div id="chat-panel">
    <div id="chat-header">
      <div id="chat-header-title">
        <span class="dot"></span>
        🌿 EcoVitals AI
      </div>
      <button id="chat-close-btn" onclick="toggleChat()">✕</button>
    </div>
    <div id="chat-messages">
      <div class="chat-msg bot">Hi! I'm EcoVitals AI 👋 Ask me anything about your health, BMI, fitness, or wellness!</div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Ask about your health..." maxlength="500" />
      <button id="chat-send-btn" onclick="sendChatMessage()">Send</button>
    </div>
  </div>
  <button id="chat-toggle-btn" onclick="toggleChat()" title="Chat with EcoVitals AI">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
    </svg>
  </button>
</div>

<script>
(function() {
  var chatHistory = [];

  window.toggleChat = function() {
    var panel = document.getElementById('chat-panel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      document.getElementById('chat-input').focus();
    }
  };

  window.sendChatMessage = async function() {
    var input = document.getElementById('chat-input');
    var sendBtn = document.getElementById('chat-send-btn');
    var text = input.value.trim();
    if (!text) return;

    appendMsg(text, 'user');
    chatHistory.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    var typingEl = appendMsg('Thinking…', 'typing');

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      });
      var data = await res.json();
      var reply = data.reply || data.error || 'Sorry, I could not get a response. Please try again.';
      typingEl.remove();
      appendMsg(reply, 'bot');
      chatHistory.push({ role: 'assistant', content: reply });
    } catch (e) {
      typingEl.remove();
      appendMsg('Connection error. Please try again.', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  };

  function appendMsg(text, type) {
    var msgs = document.getElementById('chat-messages');
    var el = document.createElement('div');
    el.className = 'chat-msg ' + type;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  document.getElementById('chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      window.sendChatMessage();
    }
  });
})();
</script>

</body>
</html>
