<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#2f2f3f;
      --card:#3a2f4a;
      --card2:#4a3f5f;
      --text:#d1c4e9;
      --accent:#9b5cff;
      --accent2:#c084fc;
      --shadow:#654a9f;
    }

    body.light-theme{
      --bg:#f4f4ff;
      --card:#ffffff;
      --card2:#ece8ff;
      --text:#2b2142;
      --accent:#7c3aed;
      --accent2:#a855f7;
      --shadow:#b794f4;
    }

    body{
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
      transition: 0.4s;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      font-size:2rem;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:15px;
      flex-wrap:wrap;
    }

    /* THEME SLIDER */

    .theme-switch-wrapper{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .theme-switch{
      position:relative;
      width:60px;
      height:30px;
    }

    .theme-switch input{
      opacity:0;
      width:0;
      height:0;
    }

    .slider-round{
      position:absolute;
      inset:0;
      background:#4a3f5f;
      border-radius:34px;
      cursor:pointer;
      transition:0.4s;
    }

    .slider-round::before{
      content:"";
      position:absolute;
      width:22px;
      height:22px;
      left:4px;
      bottom:4px;
      background:white;
      border-radius:50%;
      transition:0.4s;
    }

    .theme-switch input:checked + .slider-round{
      background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
    }

    .theme-switch input:checked + .slider-round::before{
      transform:translateX(30px);
    }

    .slider-box{
      background:var(--card);
      padding:15px;
      border-radius:16px;
      box-shadow:0 0 15px var(--shadow);
      margin-bottom:20px;
    }

    .slider-box h3{
      margin-bottom:12px;
    }

    .slider{
      width:100%;
      height:10px;
      border-radius:10px;
      outline:none;
      appearance:none;
      background:linear-gradient(
        to right,
        var(--accent),
        var(--accent2)
      );
    }

    .slider::-webkit-slider-thumb{
      appearance:none;
      width:22px;
      height:22px;
      border-radius:50%;
      background:white;
      cursor:pointer;
      box-shadow:0 0 10px var(--accent);
    }

    .tracker-card{
      background:var(--card);
      padding:20px;
      border-radius:18px;
      box-shadow:0 0 20px var(--shadow);
      margin-bottom:20px;
    }

    input, button {
      background: var(--card2);
      border: none;
      color: var(--text);
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 10px;
      width:100%;
      transition:0.3s;
    }

    button {
      cursor: pointer;
      font-weight:bold;
    }

    button:hover {
      transform:translateY(-2px);
      background: var(--accent);
      color:white;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    #chartContainer {
      margin-top: 30px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 0 15px var(--shadow);
      padding: 15px;
    }

    .chart-toggle {
      margin-top: 15px;
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
    }

    .chart-toggle button{
      margin:0;
    }

    .water-output{
      text-align:center;
      margin-top:10px;
      font-size:1.1rem;
      font-weight:bold;
      color:var(--accent2);
    }

    @media(max-width:700px){
      canvas{
        width:100% !important;
        height:auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">

    <h1>🩺 Health Tracker Hub</h1>

    <!-- THEME SWITCH -->

    <div class="theme-switch-wrapper">

      <span>🌙</span>

      <label class="theme-switch">

        <input type="checkbox" id="themeToggle">

        <span class="slider-round"></span>

      </label>

      <span>☀️</span>

    </div>

  </div>

  <div class="slider-box">

    <h3>💧 Daily Water Goal Slider</h3>

    <input 
      type="range" 
      min="0" 
      max="5000" 
      value="2500" 
      class="slider"
      id="waterGoalSlider"
      oninput="updateSliderValue(this.value)"
    >

    <div class="water-output">
      Goal: <span id="sliderValue">2500</span> ml
    </div>

  </div>

  <div class="tracker-card">

    <label for="date">📅 Date</label>
    <input type="date" id="date" />

    <label for="heart-rate">❤️ Heart Rate (bpm)</label>
    <input type="number" id="heart-rate" min="0" />

    <label for="steps">🚶 Steps</label>
    <input type="number" id="steps" min="0" />

    <label for="water-intake">💧 Water Intake (ml)</label>
    <input type="number" id="water-intake" min="0" />

    <button onclick="submitHealthData()">
      ✅ Submit Data
    </button>

    <button onclick="clearAllData()">
      🗑️ Delete All Data
    </button>

    <div class="chart-toggle">

      <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'heartRate')">
        ❤️ Heart Rate
      </button>

      <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'steps')">
        🚶 Steps
      </button>

      <button onclick="renderChart(JSON.parse(localStorage.getItem('healthData')) || [], currentChartType, 'waterIntake')">
        💧 Water
      </button>

      <button onclick="toggleChart('bar')">
        📊 Bar
      </button>

      <button onclick="toggleChart('line')">
        📈 Line
      </button>

    </div>

  </div>

  <div id="chartContainer">
    <canvas id="healthChart" width="600" height="300"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

    let currentChartType = 'bar';
    let chartInstance;

    /* THEME SWITCH */

    const toggle =
      document.getElementById('themeToggle');

    if(localStorage.getItem('theme') === 'light'){
      document.body.classList.add('light-theme');
      toggle.checked = true;
    }

    toggle.addEventListener('change', () => {

      document.body.classList.toggle('light-theme');

      localStorage.setItem(
        'theme',
        document.body.classList.contains('light-theme')
        ? 'light'
        : 'dark'
      );

    });

    function updateSliderValue(value){
      document.getElementById('sliderValue').textContent = value;
    }

    function submitHealthData() {

      const date =
        document.getElementById('date').value;

      const heartRate =
        parseInt(
          document.getElementById('heart-rate').value,
          10
        );

      const steps =
        parseInt(
          document.getElementById('steps').value,
          10
        );

      const waterIntake =
        parseInt(
          document.getElementById('water-intake').value,
          10
        );

      if (
        !date ||
        isNaN(heartRate) ||
        isNaN(steps) ||
        isNaN(waterIntake)
      ) {
        alert('⚠️ Please fill out all fields correctly.');
        return;
      }

      if (heartRate > 160) {
        alert('🚨 Alert: Heart rate is too high!');
      }

      const waterGoal =
        parseInt(
          document.getElementById('waterGoalSlider').value
        );

      if (waterIntake < waterGoal) {
        alert('🚱 Water intake below your goal!');
      }

      const newEntry = {
        date,
        heartRate,
        steps,
        waterIntake
      };

      let storedData =
        JSON.parse(localStorage.getItem('healthData'))
        || [];

      storedData.push(newEntry);

      localStorage.setItem(
        'healthData',
        JSON.stringify(storedData)
      );

      alert('✅ Data saved successfully!');

      renderChart(storedData, currentChartType);

      [
        'date',
        'heart-rate',
        'steps',
        'water-intake'
      ].forEach(id => {
        document.getElementById(id).value = '';
      });

    }

    function clearAllData() {

      const confirmDelete =
        confirm("⚠️ Delete all saved health data?");

      if (confirmDelete) {

        localStorage.removeItem('healthData');

        if (chartInstance) {
          chartInstance.destroy();
        }

        const ctx =
          document
          .getElementById('healthChart')
          .getContext('2d');

        ctx.clearRect(
          0,
          0,
          ctx.canvas.width,
          ctx.canvas.height
        );

        alert("🗑️ All data deleted!");

      }

    }

    function toggleChart(type) {

      currentChartType = type;

      const savedData =
        JSON.parse(localStorage.getItem('healthData'))
        || [];

      renderChart(savedData, type);

    }

    function renderChart(
      data,
      type,
      metric = 'heartRate'
    ) {

      const ctx =
        document
        .getElementById('healthChart')
        .getContext('2d');

      const grouped = {};

      data.forEach(entry => {

        if (!grouped[entry.date]) {

          grouped[entry.date] = {
            heartRate: [],
            steps: [],
            waterIntake: []
          };

        }

        grouped[entry.date]
        .heartRate.push(entry.heartRate);

        grouped[entry.date]
        .steps.push(entry.steps);

        grouped[entry.date]
        .waterIntake.push(entry.waterIntake);

      });

      const dates =
        Object.keys(grouped)
        .sort()
        .slice(-7);

      const averaged = dates.map(date => {

        const vals = grouped[date];

        const avg = arr =>
          Math.round(
            arr.reduce((a, b) => a + b, 0)
            / arr.length
          );

        return {
          date,
          heartRate: avg(vals.heartRate),
          steps: avg(vals.steps),
          waterIntake: avg(vals.waterIntake)
        };

      });

      const labels =
        averaged.map(entry => entry.date);

      let graphData = [];
      let graphLabel = '';
      let graphColor = '';
      let unit = '';

      if (metric === 'heartRate') {

        graphData =
          averaged.map(entry => entry.heartRate);

        graphLabel = '❤️ Heart Rate';

        graphColor =
          'rgba(186, 85, 211, 1)';

        unit = 'BPM';

      }

      if (metric === 'steps') {

        graphData =
          averaged.map(entry => entry.steps);

        graphLabel = '🚶 Steps';

        graphColor =
          'rgba(128, 0, 128, 1)';

        unit = 'Steps';

      }

      if (metric === 'waterIntake') {

        graphData =
          averaged.map(entry => entry.waterIntake);

        graphLabel =
          '💧 Water Intake';

        graphColor =
          'rgba(147, 112, 219, 1)';

        unit = 'ml';

      }

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {

        type: type,

        data: {

          labels,

          datasets: [

            {
              label:
                `${graphLabel} (${unit})`,

              data: graphData,

              borderColor: graphColor,

              backgroundColor:
                graphColor.replace('1)', '0.3)'),

              fill: type === 'line',

              tension: 0.4,

              borderWidth: 3,

              pointRadius:
                type === 'line'
                ? 4
                : 0,

              barThickness:
                type === 'bar'
                ? 25
                : undefined
            }

          ]
        },

        options: {

          responsive: true,

          plugins: {

            title: {

              display: true,

              text:
                `${graphLabel} - Last 7 Days`,

              color: '#c084fc',

              font: {
                size: 20
              }

            },

            legend: {

              labels: {
                color: '#c084fc'
              }

            }

          },

          scales: {

            x: {

              ticks: {
                color: '#c084fc'
              },

              grid: {
                color: '#5a4e7a'
              }

            },

            y: {

              beginAtZero: true,

              ticks: {

                color: '#c084fc',

                callback: function(value) {
                  return value + ' ' + unit;
                }

              },

              grid: {
                color: '#5a4e7a'
              }

            }

          },

          animation: {

            duration: 1000,

            easing: 'easeOutQuart'

          }

        }

      });

    }

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        const savedData =
          JSON.parse(
            localStorage.getItem('healthData')
          ) || [];

        if (savedData.length) {

          renderChart(
            savedData,
            currentChartType
          );

        }

      }
    );

  </script>

</body>
</html>
