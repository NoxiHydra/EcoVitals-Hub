<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAid - Emergency Health & Disaster Reporting</title>

  <style>
    :root{
      --primary:#7c3aed;
      --primary-light:#a78bfa;
    }

    [data-theme="light"]{
      --bg:#faf9ff;
      --bg2:#f3f0ff;
      --card:#ffffff;
      --text:#2e1065;
      --text-muted:#6d5a8a;
      --border:rgba(124,58,237,0.12);
      --shadow:0 8px 30px rgba(124,58,237,0.12);
      --nav-bg:rgba(250,249,255,0.92);
      --blob1:rgba(167,139,250,0.22);
      --blob2:rgba(196,181,253,0.18);
      --blob3:rgba(124,58,237,0.10);
    }

    [data-theme="dark"]{
      --bg:#0f0a1e;
      --bg2:#1a1035;
      --card:rgba(42,28,70,0.82);
      --text:#ede9fe;
      --text-muted:#b8a7db;
      --border:rgba(167,139,250,0.18);
      --shadow:0 0 30px rgba(124,58,237,0.25);
      --nav-bg:rgba(15,10,30,0.92);
      --blob1:rgba(91,33,182,0.35);
      --blob2:rgba(109,40,217,0.28);
      --blob3:rgba(167,139,250,0.15);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      transition:0.4s;
    }

    /* BLOBS */

    .bg-blob{
      position:fixed;
      border-radius:50%;
      filter:blur(90px);
      z-index:-1;
    }

    .blob-1{
      width:500px;
      height:500px;
      background:var(--blob1);
      top:-180px;
      left:-120px;
    }

    .blob-2{
      width:420px;
      height:420px;
      background:var(--blob2);
      bottom:-140px;
      right:-120px;
    }

    .blob-3{
      width:300px;
      height:300px;
      background:var(--blob3);
      top:40%;
      left:40%;
    }

    /* NAV */

    nav{
      position:sticky;
      top:0;
      z-index:1000;

      background:var(--nav-bg);
      backdrop-filter:blur(18px);

      border-bottom:1px solid var(--border);

      padding:14px 28px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .nav-logo{
      color:var(--primary);
      text-decoration:none;
      font-size:1.4rem;
      font-weight:bold;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .nav-link{
      color:var(--text-muted);
      text-decoration:none;
      padding:8px 15px;
      border-radius:30px;
      font-weight:bold;
      transition:0.25s;
    }

    .nav-link:hover,
    .nav-link.active{
      background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-light)
      );

      color:white;
    }

    /* THEME SWITCH */

    .theme-btn{
      width:56px;
      height:28px;

      border:none;
      border-radius:50px;

      background:rgba(124,58,237,0.25);

      position:relative;
      cursor:pointer;
    }

    .theme-thumb{
      position:absolute;

      top:3px;
      left:3px;

      width:22px;
      height:22px;

      border-radius:50%;

      background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-light)
      );

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:11px;

      transition:0.3s;
    }

    [data-theme="dark"] .theme-thumb{
      transform:translateX(28px);
    }

    header{
      text-align:center;
      color:var(--primary);
      font-size:2rem;
      font-weight:bold;
      padding:2rem 1rem 1rem;
    }

    .container{
      padding:2rem;
      max-width:1200px;
      margin:auto;
    }

    .form-section,
    .report-board,
    .hotlines,
    .disaster-feed{
      background:var(--card);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      padding:1.5rem;
      border-radius:22px;
      margin-bottom:2rem;
    }

    .form-section h2,
    .hotlines h2,
    .disaster-feed h2,
    .report-board h2{
      color:var(--primary);
      margin-bottom:1rem;
    }

    label{
      display:block;
      margin-top:1rem;
      font-weight:bold;
      color:var(--text-muted);
    }

    select,
    textarea,
    input[type="text"]{
      width:100%;
      padding:0.9rem;
      margin-top:0.5rem;

      border-radius:14px;

      border:1px solid var(--border);

      background:var(--bg2);
      color:var(--text);

      outline:none;
    }

    button{
      margin-top:1rem;
      padding:0.85rem 1.5rem;

      border:none;
      border-radius:14px;

      background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-light)
      );

      color:white;
      font-weight:bold;

      cursor:pointer;

      transition:0.25s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    .report,
    .disaster{
      background:var(--bg2);
      padding:1rem;
      border-left:5px solid var(--primary);
      margin-bottom:1rem;
      border-radius:12px;
    }

    .hotlines ul{
      list-style:none;
      padding:0;
    }

    .hotlines li{
      margin:0.7rem 0;
    }

    .hotlines a{
      color:var(--primary);
      text-decoration:none;
      font-weight:bold;
    }

    .hotlines a:hover{
      text-decoration:underline;
    }

    @media(max-width:768px){

      nav{
        padding:12px 16px;
      }

      header{
        font-size:1.5rem;
      }

      .container{
        padding:1rem;
      }

    }
  </style>
</head>

<body>

  <!-- BLOBS -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-logo" href="#">🚑 SmartAid</a>

    <div class="nav-links">
      <a href="#" class="nav-link active">Home</a>

      <button class="theme-btn" onclick="toggleTheme()">
        <div class="theme-thumb" id="theme-thumb">☀️</div>
      </button>
    </div>
  </nav>

  <!-- HEADER -->
  <header>
    🚨 SmartAid - Emergency Health & Disaster Reporting
  </header>

  <div class="container">

    <section class="form-section">

      <h2>📝 Report an Emergency</h2>

      <label for="type">Emergency Type:</label>

      <select id="type">
        <option value="Fire">🔥 Fire</option>
        <option value="Flood">🌊 Flood</option>
        <option value="Injury">🩹 Injury</option>
        <option value="Earthquake">🌍 Earthquake</option>
        <option value="Medical Emergency">🚑 Medical Emergency</option>
        <option value="Building Collapse">🏚️ Building Collapse</option>
        <option value="Road Accident">🚗 Road Accident</option>
        <option value="Power Outage">💡 Power Outage</option>
        <option value="Gas Leak">🛢️ Gas Leak</option>
      </select>

      <label for="location">📍 Location:</label>

      <input type="text" id="location" placeholder="Enter location">

      <button onclick="getLocation()">
        📍 Use My Location
      </button>

      <label for="description">🗒️ Description:</label>

      <textarea id="description" rows="4" placeholder="Provide a short description"></textarea>

      <button onclick="submitReport()">
        🚀 Submit Report
      </button>

      <button onclick="clearReports()">
        🗑️ Clear All Reports
      </button>

    </section>

    <section class="report-board">

      <h2>📡 Live Emergency Reports</h2>

      <div id="report-list"></div>

    </section>

    <section class="disaster-feed">

      <h2>🌍 City Pulse - Real-Time Disaster Feed</h2>

      <div id="disaster-list"></div>

    </section>

    <section class="hotlines">

      <h2>📞 Emergency Helplines</h2>

      <ul>
        <li>🚔 Police: <a href="tel:100">100</a></li>
        <li>🚒 Fire: <a href="tel:101">101</a></li>
        <li>🚑 Ambulance: <a href="tel:102">102</a></li>
        <li>🧠 Mental Health: <a href="tel:9152987821">9152987821</a></li>
        <li>👮 Disaster Management: <a href="tel:108">108</a></li>
      </ul>

    </section>

  </div>

  <script>

    function toggleTheme(){

      const html = document.documentElement;

      const dark =
        html.getAttribute('data-theme') === 'dark';

      html.setAttribute(
        'data-theme',
        dark ? 'light' : 'dark'
      );

      document.getElementById('theme-thumb').textContent =
        dark ? '☀️' : '🌙';

      localStorage.setItem(
        'smartaid-theme',
        dark ? 'light' : 'dark'
      );
    }

    (function(){

      const saved =
        localStorage.getItem('smartaid-theme') || 'light';

      document.documentElement.setAttribute(
        'data-theme',
        saved
      );

      const thumb =
        document.getElementById('theme-thumb');

      if(thumb){
        thumb.textContent =
          saved === 'dark' ? '🌙' : '☀️';
      }

    })();

    const disasterData = [
      {
        type: "Fire",
        description: "🔥 Large fire in downtown area."
      },
      {
        type: "Flood",
        description: "🌊 Severe flooding reported in suburbs."
      },
      {
        type: "Earthquake",
        description: "🌍 Earthquake of magnitude 5.4 near city center."
      },
      {
        type: "Road Accident",
        description: "🚗 Serious road accident near the highway."
      }
    ];

    function displayDisasters(){

      const disasterList =
        document.getElementById('disaster-list');

      disasterList.innerHTML = '';

      disasterData.forEach((disaster)=>{

        const div =
          document.createElement('div');

        div.className = 'disaster';

        div.innerHTML =
          `<strong>${disaster.type}</strong><br>${disaster.description}`;

        disasterList.appendChild(div);

      });

    }

    function getLocation(){

      if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

          (position)=>{

            const { latitude, longitude } =
              position.coords;

            document.getElementById('location').value =
              `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}`;

          },

          ()=>{

            alert(
              'Unable to fetch location.'
            );

          }

        );

      }

    }

    function submitReport(){

      const type =
        document.getElementById('type').value;

      const location =
        document.getElementById('location').value;

      const description =
        document.getElementById('description').value;

      const timestamp =
        new Date().toLocaleString();

      const report = {
        type,
        location,
        description,
        timestamp
      };

      let reports =
        JSON.parse(localStorage.getItem('reports')) || [];

      reports.push(report);

      localStorage.setItem(
        'reports',
        JSON.stringify(reports)
      );

      displayReports();

      document.getElementById('location').value = '';
      document.getElementById('description').value = '';

    }

    function displayReports(){

      const reportList =
        document.getElementById('report-list');

      reportList.innerHTML = '';

      const reports =
        JSON.parse(localStorage.getItem('reports')) || [];

      reports.forEach((report)=>{

        const div =
          document.createElement('div');

        div.className = 'report';

        div.innerHTML = `
          <strong>${report.type}</strong>
          <br>
          📍 ${report.location}
          <br>
          <small>${report.timestamp}</small>
          <br><br>
          ${report.description}
        `;

        reportList.appendChild(div);

      });

    }

    function clearReports(){

      localStorage.removeItem('reports');

      displayReports();

    }

    window.onload = ()=>{

      displayReports();

      displayDisasters();

    };

  </script>

</body>
</html>
