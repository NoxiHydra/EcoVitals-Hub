<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoVitals BMI Calculator</title>

<style>

:root{
  --primary:#7c3aed;
  --primary-light:#a78bfa;
}

[data-theme="light"]{
  --bg:#faf9ff;
  --bg2:#f3f0ff;
  --card:#ffffff;
  --text:#2e1065;
  --text-muted:#6d5a8a;
  --border:rgba(124,58,237,0.12);
  --shadow:0 8px 30px rgba(124,58,237,0.12);
}

[data-theme="dark"]{
  --bg:#0f0a1e;
  --bg2:#1a1035;
  --card:rgba(42,28,70,0.85);
  --text:#ede9fe;
  --text-muted:#b8a7db;
  --border:rgba(167,139,250,0.18);
  --shadow:0 0 30px rgba(124,58,237,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  padding:2rem;

  font-family:'Segoe UI',sans-serif;

  background:var(--bg);
  color:var(--text);

  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:2rem;
  flex-wrap:wrap;

  transition:0.4s;

  overflow-x:hidden;

  position:relative;
}

body::before,
body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(100px);
  z-index:-1;
}

body::before{
  width:450px;
  height:450px;
  background:rgba(167,139,250,0.22);
  top:-140px;
  left:-120px;
}

body::after{
  width:350px;
  height:350px;
  background:rgba(124,58,237,0.18);
  bottom:-120px;
  right:-100px;
}

.container,
.converter{
  width:330px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:24px;

  padding:2rem;

  backdrop-filter:blur(16px);

  box-shadow:var(--shadow);

  transition:0.3s;
}

.container:hover,
.converter:hover{
  transform:translateY(-6px);
}

h2{
  text-align:center;
  margin-bottom:1.2rem;

  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-light)
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

label{
  display:block;
  margin-top:1rem;

  color:var(--text-muted);

  font-weight:600;
}

input{
  width:100%;
  padding:0.9rem;

  margin-top:0.4rem;

  border-radius:14px;

  border:1px solid var(--border);

  background:var(--bg2);

  color:var(--text);

  outline:none;

  transition:0.25s;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(124,58,237,0.12);
}

button{
  width:100%;

  padding:0.95rem;

  margin-top:1.2rem;

  border:none;

  border-radius:14px;

  font-weight:700;

  cursor:pointer;

  color:white;

  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-light)
  );

  transition:0.25s;
}

button:hover{
  transform:translateY(-2px);
}

.gender-select{
  display:flex;
  gap:0.5rem;
  margin-top:1rem;
}

.gender-option{
  flex:1;

  padding:0.8rem;

  border-radius:14px;

  background:var(--bg2);

  border:1px solid var(--border);

  text-align:center;

  cursor:pointer;

  transition:0.25s;

  color:var(--text-muted);
}

.gender-option.selected{
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-light)
  );

  color:white;
}

#result,
#convertedHeight{
  margin-top:1rem;

  text-align:center;

  font-size:1.1rem;

  font-weight:700;

  color:var(--primary);
}

.range-text{
  margin-top:0.8rem;

  text-align:center;

  font-size:0.88rem;

  color:var(--text-muted);
}

.health-info,
#recordsList{
  margin-top:1rem;

  background:var(--bg2);

  border-radius:16px;

  border:1px solid var(--border);

  padding:1rem;
}

#themeToggle{
  position:fixed;
  top:20px;
  right:20px;
  z-index:999;
}

.theme-btn{
  width:54px;
  height:28px;

  border:none;

  border-radius:50px;

  position:relative;

  background:rgba(124,58,237,0.2);

  cursor:pointer;
}

.theme-thumb{
  position:absolute;

  top:3px;
  left:3px;

  width:22px;
  height:22px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-light)
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;

  transition:0.3s;
}

[data-theme="dark"] .theme-thumb{
  transform:translateX(26px);
}

@media(max-width:700px){

  body{
    padding:1rem;
  }

  .container,
  .converter{
    width:100%;
    max-width:400px;
  }

}

</style>
</head>
<body>

<div id="themeToggle">
  <button class="theme-btn" onclick="toggleTheme()">
    <div class="theme-thumb" id="theme-thumb">☀️</div>
  </button>
</div>

<div class="container">

  <h2>BMI Calculator</h2>

  <div class="gender-select">
    <div class="gender-option" id="male" onclick="selectGender('male')">
      ♂ Male
    </div>

    <div class="gender-option" id="female" onclick="selectGender('female')">
      ♀ Female
    </div>

    <div class="gender-option" id="other" onclick="selectGender('other')">
      ⚧ Other
    </div>
  </div>

  <label>Age</label>
  <input type="number" id="age" placeholder="Enter your age">

  <label>Height (cm)</label>
  <input type="number" id="height" placeholder="Enter your height">

  <label>Weight (kg)</label>
  <input type="number" id="weight" placeholder="Enter your weight">

  <button onclick="calculateBMI()">
    Calculate BMI
  </button>

  <div id="result"></div>

  <div class="range-text">
    Underweight: &lt;18.5 |
    Normal: 18.5–24.9 |
    Overweight: 25–29.9 |
    Obese: ≥30
  </div>

  <div id="health-icon" style="display:none;">
    <button onclick="toggleHealthInfo()">
      Know More
    </button>
  </div>

  <div id="health-info" class="health-info"></div>

</div>

<div class="converter">

  <h2>Feet & Inches to CM</h2>

  <label>Feet</label>
  <input type="number" id="feet" placeholder="Enter feet">

  <label>Inches</label>
  <input type="number" id="inches" placeholder="Enter inches">

  <button onclick="convertToCM()">
    Convert
  </button>

  <div id="convertedHeight"></div>

</div>

<script>

let selectedGender = null;
let currentHealthInfo = '';

function selectGender(gender){

  selectedGender = gender;

  document
    .querySelectorAll('.gender-option')
    .forEach(el => el.classList.remove('selected'));

  document
    .getElementById(gender)
    .classList.add('selected');
}

function calculateBMI(){

  const age =
    parseInt(document.getElementById('age').value);

  const height =
    parseFloat(document.getElementById('height').value);

  const weight =
    parseFloat(document.getElementById('weight').value);

  const result =
    document.getElementById('result');

  const icon =
    document.getElementById('health-icon');

  if(!selectedGender || !age || !height || !weight){

    result.textContent =
      'Please fill all fields.';

    return;
  }

  const bmi =
    (
      weight /
      ((height/100)*(height/100))
    ).toFixed(2);

  let status='';

  if(bmi < 18.5){
    status='Underweight';
  }
  else if(bmi < 25){
    status='Normal weight';
  }
  else if(bmi < 30){
    status='Overweight';
  }
  else{
    status='Obese';
  }

  result.textContent =
    `Your BMI is ${bmi} (${status})`;

  icon.style.display='block';

  // SAVE TO DASHBOARD

  const bmiData = {

    age: age,

    gender: selectedGender,

    height: height,

    weight: weight,

    bmi: bmi,

    status: status,

    timestamp: new Date().toLocaleString()

  };

  let records = [];

  try{

    records =
      JSON.parse(
        localStorage.getItem('bmiRecords')
      ) || [];

  }catch(e){

    records = [];

  }

  records.push(bmiData);

  localStorage.setItem(
    'bmiRecords',
    JSON.stringify(records)
  );

}

function toggleHealthInfo(){

  const info =
    document.getElementById('health-info');

  info.style.display =
    info.style.display === 'block'
      ? 'none'
      : 'block';

  info.innerHTML =
    'Maintain a balanced diet, stay hydrated, exercise regularly, and sleep properly for better health.';
}

function convertToCM(){

  const feet =
    parseInt(document.getElementById('feet').value);

  const inches =
    parseInt(document.getElementById('inches').value);

  const converted =
    document.getElementById('convertedHeight');

  if(isNaN(feet) || isNaN(inches)){

    converted.textContent =
      'Please enter both feet and inches.';

    return;
  }

  const cm =
    (((feet*12)+inches)*2.54).toFixed(2);

  converted.textContent =
    `Height in CM: ${cm} cm`;
}

function toggleTheme(){

  const html =
    document.documentElement;

  const dark =
    html.getAttribute('data-theme') === 'dark';

  html.setAttribute(
    'data-theme',
    dark ? 'light' : 'dark'
  );

  document.getElementById('theme-thumb').textContent =
    dark ? '☀️' : '🌙';

  localStorage.setItem(
    'ecovitals-theme',
    dark ? 'light' : 'dark'
  );
}

(function(){

  const saved =
    localStorage.getItem('ecovitals-theme')
    || 'light';

  document.documentElement.setAttribute(
    'data-theme',
    saved
  );

  document.getElementById('theme-thumb').textContent =
    saved === 'dark'
      ? '🌙'
      : '☀️';

})();

</script>

</body>
</html>
